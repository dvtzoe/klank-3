[project]
name = "klank-3"
version = "0.1.0"
description = "klank klank klank"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "numpy>=2.3.5",
    "openai>=2.14.0",
    "openwakeword>=0.4.0",
    "packaging>=25.0",
    "pyaudio>=0.2.14",
    "torch>=2.9.1",
    "torchaudio>=2.9.1",
]

[dependency-groups]
dev = [
    "ruff>=0.14.10",
]

[tool.ruff.lint]
extend-select = ["I"]
